<title>Yashish Portfolio Film</title>
<style>
  /* Layout: the film is the page — one 16:9 stage, a transport row under it, scene chips below. Deliberately single dark look, matching the film's ink ground. */
  :root {
    --ink: #050404;
    --panel: #120D0F;
    --line: #2A2124;
    --type: #FBF3F7;
    --muted: #A8989F;
    --sig: #FF4A1C;
    --lilac: #C7A8FF;
    --display: "Inter Display", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @font-face { font-family: "Inter Display"; font-weight: 700; src: url("fonts/InterDisplay-Bold.otf") format("opentype"); }
  @font-face { font-family: "Inter Display"; font-weight: 800; src: url("fonts/InterDisplay-ExtraBold.otf") format("opentype"); }
  html, body { background: var(--ink); color: var(--type); }
  body { font-family: var(--display); padding: 24px 16px 40px; }
  main { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  h1 { margin: 0; font-size: clamp(22px, 3.2vw, 32px); font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
  h1 span { color: var(--sig); }
  .spec { font: 12px/1.4 var(--mono); color: var(--muted); letter-spacing: 0.04em; }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden; outline: 1px solid var(--line); cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .transport { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; }
  button { font: inherit; color: inherit; }
  .play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--sig); color: #fff; display: grid; place-items: center; cursor: pointer; }
  .play svg { width: 16px; height: 16px; fill: currentColor; }
  .play:focus-visible, .chip:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--lilac); outline-offset: 3px; }
  .time { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .time b { color: var(--type); font-weight: 600; }
  input[type=range] { width: 100%; min-width: 0; accent-color: var(--sig); }
  .scenes { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; gap: 8px; align-items: baseline; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 14px; font-weight: 700; }
  .chip small { font: 11px var(--mono); color: var(--muted); }
  .chip[aria-current="true"] { border-color: var(--sig); }
  .chip[aria-current="true"] small { color: var(--sig); }
  .hint { font: 12px var(--mono); color: var(--muted); margin: 0; }
  @media (max-width: 520px) { .time { display: none; } .transport { grid-template-columns: auto 1fr; } }
</style>

<main>
  <header>
    <h1>Yashish <span>·</span> portfolio film</h1>
    <div class="spec">1920×1080 · 24 fps · 360 frames · 15.0 s · silent</div>
  </header>

  <div class="stage" id="stage" title="Click to play or pause">
    <canvas id="film" width="1920" height="1080" aria-label="Portfolio film preview"></canvas>
  </div>

  <div class="transport">
    <button class="play" id="play" aria-label="Play"><svg id="icon" viewBox="0 0 16 16"><path d="M3 1.5v13L14 8z"/></svg></button>
    <input type="range" id="scrub" min="0" max="359" value="0" step="1" aria-label="Frame">
    <div class="time" id="time"><b>00.00 s</b> · f000</div>
  </div>

  <nav class="scenes" id="scenes" aria-label="Scenes"></nav>
  <p class="hint">Space plays or pauses · ← → step one frame · click a scene to jump to it</p>
</main>

<script src="film.js"></script>
<script>
(() => {
  const SCENES = [
    ['01', 'Ignite', 0], ['02', 'Identity', 24], ['03', 'Role', 72], ['04', 'Philosophy', 120],
    ['05', 'Experience', 178], ['06', 'Craft', 240], ['07', 'Signature', 302],
  ];
  const scrub = document.getElementById('scrub');
  const time = document.getElementById('time');
  const playBtn = document.getElementById('play');
  const icon = document.getElementById('icon');
  const nav = document.getElementById('scenes');
  const PLAY = '<path d="M3 1.5v13L14 8z"/>';
  const PAUSE = '<path d="M3 1.5h3.5v13H3zM9.5 1.5H13v13H9.5z"/>';

  const chips = SCENES.map(([n, name, at]) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.innerHTML = `<small>${n}</small>${name}`;
    b.addEventListener('click', () => { pause(); show(at); });
    nav.appendChild(b);
    return b;
  });

  let frame = 0, playing = false, origin = 0, raf = 0;

  function show(f) {
    frame = ((f % TOTAL) + TOTAL) % TOTAL;
    renderFrame(frame);
    scrub.value = frame;
    time.innerHTML = `<b>${(frame / FPS).toFixed(2).padStart(5, '0')} s</b> · f${String(frame).padStart(3, '0')}`;
    let k = 0;
    SCENES.forEach(([, , at], i) => { if (frame >= at) k = i; });
    chips.forEach((c, i) => c.setAttribute('aria-current', i === k ? 'true' : 'false'));
  }

  function tick(now) {
    const f = Math.floor(((now - origin) / 1000) * FPS);
    if (f !== frame) show(f);
    raf = requestAnimationFrame(tick);
  }

  function play() {
    playing = true;
    origin = performance.now() - (frame / FPS) * 1000;
    icon.innerHTML = PAUSE; playBtn.setAttribute('aria-label', 'Pause');
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    playing = false;
    cancelAnimationFrame(raf);
    icon.innerHTML = PLAY; playBtn.setAttribute('aria-label', 'Play');
  }

  const toggle = () => (playing ? pause() : play());
  playBtn.addEventListener('click', toggle);
  document.getElementById('stage').addEventListener('click', toggle);
  scrub.addEventListener('input', () => { pause(); show(+scrub.value); });
  document.addEventListener('keydown', (e) => {
    if (e.target === scrub && e.key.startsWith('Arrow')) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    if (e.key === 'ArrowRight') { pause(); show(frame + 1); }
    if (e.key === 'ArrowLeft') { pause(); show(frame - 1); }
  });

  // Open on the stack frame so the still preview reads at a glance; autoplay unless reduced motion is set.
  Promise.all([
    document.fonts.load('700 100px "Inter Display"'),
    document.fonts.load('800 100px "Inter Display"'),
  ]).catch(() => {}).then(() => {
    show(60);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) { frame = 0; show(0); play(); }
  });
})();
</script>
